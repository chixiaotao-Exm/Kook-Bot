name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ai-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ai-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ai-bot/package-lock.json
      - run: npm ci
      - run: npm test

  quota-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: quota-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: quota-dashboard/package-lock.json
      - run: npm ci
      - run: npm test

  music-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: music-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: music-bot/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: music-bot/qq/requirements.lock.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run build:web
      - run: npm test
        env:
          TEST_FFMPEG_PATH: /usr/bin/ffmpeg
      - run: python -m pip install -r qq/requirements.lock.txt
      - run: python qq/test_provider.py
