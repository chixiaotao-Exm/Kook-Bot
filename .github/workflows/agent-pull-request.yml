name: Open agent draft pull request

on:
  push:
    branches:
      - 'kook-agent/task-*'

permissions:
  contents: read
  pull-requests: write

jobs:
  open-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout or execution of candidate code. Read only the trusted report.
      - uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            if (!/^kook-agent\/task-[a-f0-9-]{36}$/.test(branch)) throw new Error('Unexpected agent branch');
            const existing = await github.rest.pulls.list({ ...context.repo, state: 'open', head: `${context.repo.owner}:${branch}` });
            if (existing.data.length) return;
            const report = await github.rest.repos.getContent({ ...context.repo, path: '.kook-agent/report.md', ref: context.sha });
            if (Array.isArray(report.data) || report.data.encoding !== 'base64') throw new Error('Missing agent evidence report');
            const body = Buffer.from(report.data.content, 'base64').toString('utf8');
            if (body.length > 30000) throw new Error('Report too large');
            const result = await github.rest.pulls.create({ ...context.repo, head: branch, base: 'main', draft: true,
              title: `Agent review: ${branch.slice('kook-agent/task-'.length, 'kook-agent/task-'.length + 8)}`, body });
            core.notice(result.data.html_url);
