services:
  report-browser:
    <<: &browser-settings
      build: .
      restart: on-failure
      env_file: .env
      mem_limit: 1g
      memswap_limit: 1g
      cpus: 1
      pids_limit: 256
      shm_size: 256m
      cap_drop: [ALL]
      security_opt: [no-new-privileges:true]
      logging:
        options:
          max-size: 5m
          max-file: "2"
    container_name: kook-report-browser
    ports:
      - "127.0.0.1:8191:8191"
  report-browser-2:
    <<: *browser-settings
    profiles: [parallel]
    container_name: kook-report-browser-8192
    ports:
      - "127.0.0.1:8192:8191"
  report-browser-3:
    <<: *browser-settings
    profiles: [parallel]
    container_name: kook-report-browser-8193
    ports:
      - "127.0.0.1:8193:8191"
