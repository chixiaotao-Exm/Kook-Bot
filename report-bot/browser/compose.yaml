services:
  report-browser:
    build: .
    restart: on-failure
    env_file: .env
    ports:
      - "127.0.0.1:8191:8191"
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1
    pids_limit: 256
    shm_size: 256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      options:
        max-size: 5m
        max-file: "2"
